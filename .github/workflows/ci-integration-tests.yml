name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/**'
      - 'cmd/**'
      - 'api/**'
      - 'internal/**'
      - 'config/**'
      - 'hack/**'
      - 'test/**'
      - 'Dockerfile'
      - 'Dockerfile.konflux'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

env:
  OPERATOR_IMG: "localhost/llm-d-batch-gateway-operator:ci"
  KIND_CLUSTER_NAME: "batch-gateway-ci"

jobs:
  integration-tests:
    name: Integration Tests (${{ matrix.dev_profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dev_profile: async
          - dev_profile: async-gate-redis
          - dev_profile: async-gate-prometheus-query
          - dev_profile: async-gate-prometheus-budget
          - dev_profile: async-gate-endpoint-scrape
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: go install sigs.k8s.io/kind@latest

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Deploy dev environment
        run: make dev-deploy
        env:
          OPERATOR_IMG: ${{ env.OPERATOR_IMG }}
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}
          DEV_PROFILE: ${{ matrix.dev_profile }}

      - name: Validate sample CRs against CRD schema
        run: |
          for f in config/samples/batch_v1alpha1_*.yaml; do
            echo "Validating $f..."
            kubectl apply --dry-run=server -f "$f"
          done

      - name: Run batch-gateway e2e tests
        run: make test-e2e-batch-gateway
        env:
          TEST_APISERVER_URL: "http://localhost:8000"

      - name: Run operator e2e tests
        run: make test-e2e-operator-no-deploy

      - name: Verify API server NetworkPolicy reconciliation
        if: ${{ matrix.dev_profile == 'async' }}
        shell: bash
        run: |
          apiserver_config=$(kubectl get configmap batch-gateway-dev-apiserver-config \
            --namespace default \
            --output jsonpath='{.data.config\.yaml}')
          grep -Fq 'allow_anonymous_tenant: true' <<< "$apiserver_config"
          grep -Fq 'proxy_token: "X-Gateway-Token"' <<< "$apiserver_config"

          kubectl patch llmbatchgateway batch-gateway-dev \
            --namespace default \
            --type merge \
            --patch '{"spec":{"apiServer":{"networkPolicy":{"enabled":true,"api":{"from":[{"namespaceSelector":{}}]}}}}}'

          for attempt in $(seq 1 60); do
            if kubectl get networkpolicy \
              --namespace default \
              --selector app.kubernetes.io/instance=batch-gateway-dev \
              --output name | grep -q .; then
              kubectl get networkpolicy \
                --namespace default \
                --selector app.kubernetes.io/instance=batch-gateway-dev \
                --output yaml
              exit 0
            fi
            sleep 2
          done

          kubectl get llmbatchgateway batch-gateway-dev --namespace default --output yaml
          echo "The pinned chart did not create an API server NetworkPolicy" >&2
          exit 1

      - name: Cleanup
        if: always()
        run: kind delete cluster --name ${{ env.KIND_CLUSTER_NAME }}
